name: Verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [worker, server]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 浏览器二进制按 lockfile 哈希缓存；命中后 --with-deps 只补系统库，省去每次 ~150MB 下载
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # e2e 内部保持 workers:1 串行（测试共享服务端状态），跨机器按文件分片并行：
      # 每片各自起全新的 webServer 与本地 D1，spec 文件自带 resetServer，互不依赖
      - if: matrix.backend == 'worker'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - if: matrix.backend == 'server'
        run: npm run test:e2e:server -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.backend }}-shard${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
